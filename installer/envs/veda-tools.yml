# VEDA :: "legacy-pickle" environment for the Raghava-lab predictors.
#
# Used by: AlgPred2, ToxinPred2  (config.TOOL_PYTHON)
#
# Those scripts import only joblib/numpy/pandas/pickle, but the model files
# they unpickle (rf_model, RF_model) contain scikit-learn estimators, so
# scikit-learn must be present AND version-compatible.
#
# WHY scikit-learn is held below 1.3 -- do not float this pin:
#
# scikit-learn 1.3 added a field to the decision-tree node struct. A forest
# pickled before 1.3 therefore cannot be loaded by 1.3 or later; it raises
#   ValueError: node array from the pickle has an incompatible dtype
# The version each model was pickled with is recorded inside the file itself
# (`strings rf_model | grep -A2 _sklearn_version`):
#
#   algpred2/rf_model      0.19.2
#   toxinpred2/RF_model    0.22
#
# Both load and predict correctly on 1.2.x and fail on everything >= 1.3.
# IL2Pred is the mirror image -- its models are pickled with 1.5.2 and need
# >= 1.3 -- which is why it no longer shares this env. See veda-il2.yml.
#
# numpy stays below 2.x for the related reason that these pickles predate the
# numpy 2 ABI change.
#
# This env also owns blastp/makeblastdb: the workers locate BLAST as
# Path(config.TOOL_PYTHON).parent / "blastp", i.e. inside this env's bin/.
# IFNEpitope2 and IL2Pred run elsewhere but still read blastp from here.
name: veda-tools
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - pip
  # See veda-ui.yml: setuptools after 80.x no longer bundles pkg_resources.
  # Python 3.9 happens to cap setuptools below that today, but pinning means
  # this env does not silently break when that stops being true.
  - setuptools<81
  - numpy=1.26.*
  - pandas=2.*
  - joblib
  - scikit-learn=1.2.*         # load-bearing: see the header. NOT >= 1.3.
  - blast                      # provides blastp + makeblastdb in this env
  - perl                       # MERCI_motif_locator.pl
